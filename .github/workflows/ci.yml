name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_LOCK_SOURCE_JOB_ID: "96040770342"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Materialize pinned pnpm lock snapshot
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/jobs/${PNPM_LOCK_SOURCE_JOB_ID}/logs" \
            > /tmp/pnpm-lock-source.log

          sed -E 's/^[0-9]{4}-[0-9]{2}-[0-9]{2}T[^ ]+Z //' /tmp/pnpm-lock-source.log \
            | awk 'BEGIN { capture = 0 } /^lockfileVersion:/ { capture = 1 } capture { print } capture && /^  zod@4[.]4[.]3: [{][}]$/ { exit }' \
            > pnpm-lock.yaml

          test "$(head -n 1 pnpm-lock.yaml)" = "lockfileVersion: '9.0'"
          test "$(tail -n 1 pnpm-lock.yaml)" = "  zod@4.4.3: {}"
          grep -Fq "specifier: 3.1111.0" pnpm-lock.yaml
          grep -Fq "version: 3.1103.0(@aws-sdk/client-dynamodb@3.1111.0)" pnpm-lock.yaml
          sha256sum pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
