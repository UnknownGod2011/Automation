name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve deterministic lockfile
        run: pnpm install --lockfile-only --frozen-lockfile=false
      - name: Require checked-in lockfile
        shell: bash
        run: |
          cat pnpm-lock.yaml
          if [[ -n "$(git status --porcelain -- pnpm-lock.yaml)" ]]; then
            echo "::error::pnpm-lock.yaml is missing or stale; check in the lockfile generated by pnpm 10.15.0"
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
